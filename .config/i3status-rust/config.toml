[theme]
theme = "default"

[icons]
icons = "material-nf"

[[block]]
block = "battery"

[[block]]
block = "backlight"

[[block]]
block = "sound"

[[block]]
block = "sound"
device_kind = "source"

[[block]]
block = "cpu"

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents "

[[block]]
block = "temperature"
chip = "coretemp-isa-0000"
format = " $icon $average "

[[block]]
block = "bluetooth"
mac = "38:D5:18:A1:58:9D"
format = " $icon {$percentage |}"
#disconnected_format = " 󰟎 "
disconnected_format = ""

[[block]]
block = "bluetooth"
mac = "B4:EE:25:E7:76:A6"
format = " $icon {$percentage |}"
#disconnected_format = " 󰍾 "
disconnected_format = ""

[[block]]
block = "pomodoro"

[[block]]
block = "music"
format = "{ $prev $play $next |}"

[[block]]
block = "net"
format = " $icon {$signal_strength $ssid @$frequency|$device} "
format_alt = " $icon {$ip 󰜮$graph_down 󰜷$graph_up} "
interval = 1

[[block]]
block = "keyboard_layout"
driver = "sway"
format = "  $layout "

[[block.click]]
button = "left"
cmd = "swaymsg 'input 1:1:AT_Translated_Set_2_keyboard xkb_switch_layout next'"

[[block]]
block = "time"
format = " $icon $timestamp.datetime(f:'%a %d %H:%M')"
